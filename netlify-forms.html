<!DOCTYPE html>
<html>
  <head><meta charset="utf-8"><title>Formulaires</title></head>
  <body>
    <!-- Static skeleton so Netlify's build bot can detect this form. -->
    <!-- The real form lives in index.html and submits here via AJAX. -->
    <form name="newsletter" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="newsletter">
      <input type="email" name="email">
      <input name="bot-field">
    </form>
  </body>
</html>
